name: Refresh blueprint data
# (2026-11-23) the run's title names the boards a Run-button build asked for, so the site's countdown can time each board from its own past runs
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Refresh {0}', github.event.inputs.leagues) || 'Refresh blueprint data' }}

on:
  schedule:
    # WEEKLY since 2026-11-19 (user: "lets make it once a week"): Wednesdays 14:00 UTC (9 AM ET), the morning after the CFP
    # committee's Tuesday release, so the CFB held-#1 tracker (rel_tops) still sees every release. The site's Run button and
    # the price-screenshot box still trigger a build any day.
    - cron: "0 14 * * 3"
    # PRE-PLAYOFF RUN (2026-11-19, user: "trigger one last run before each playoff"): a daily check that builds ONLY the leagues whose
    # first playoff game (po in data/seasons.json) is tomorrow, Eastern time -- so each board's frozen pre-playoff prices are at most a
    # day old. Most days it builds nothing (no Odds API credits). Keep the po dates in seasons.json right; approximate ones are flagged there.
    - cron: "30 13 * * *"
  workflow_dispatch:         # manual trigger + the dashboard "Run" button
    inputs:
      leagues:
        description: "Comma-separated leagues to build (nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague,euroleague,nbl,aleague,liiga,ligamx,superrugby,urc,ahl,swissnl)"
        required: false
        default: "nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague,euroleague,nbl,aleague,liiga,ligamx,superrugby,urc,ahl,swissnl"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick leagues
        id: pick
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_LEAGUES: ${{ github.event.inputs.leagues }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, zoneinfo
          ALL = "nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague,euroleague,nbl,aleague,liiga,ligamx,superrugby,urc,ahl,swissnl"
          if os.environ.get("EVENT_SCHEDULE") == "30 13 * * *":            # the daily pre-playoff check
              tomorrow = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York")).date() + datetime.timedelta(days=1)
              lg = json.load(open("data/seasons.json", encoding="utf-8"))["leagues"]
              due = [L["key"] for L in lg if L.get("site") and L["key"] in ALL.split(",") and L.get("po") == tomorrow.isoformat()]
              leagues = ",".join(due)
              print(f"playoffs starting {tomorrow}: {leagues or 'none -- nothing to build'}")
          else:                                                            # the weekly run, or the Run button / a price save
              leagues = os.environ.get("INPUT_LEAGUES") or ALL
          print(f"leagues={leagues}", file=open(os.environ["GITHUB_OUTPUT"], "a"))
          PY

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.leagues != ''
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4     # the MLS, NWSL, FCS, CFL, AFL, NRL, Super League, EuroLeague and NBL engines are Node (scripts/mls/soccer.mjs, scripts/college/*.mjs, scripts/pro/*.mjs)
        if: steps.pick.outputs.leagues != ''
        with:
          node-version: "20"

      - uses: actions/cache@v4          # Node engines' data caches (ESPN scoreboards; past seasons never change) -- keeps MLS/FCS builds fast
        if: steps.pick.outputs.leagues != ''
        with:
          path: |
            /tmp/college_bp_cache
            /tmp/pro_bp_cache
          key: bp-engine-cache-${{ github.run_id }}
          restore-keys: bp-engine-cache-

      - name: Install college-basketball deps (parquet game data)
        if: steps.pick.outputs.leagues != ''
        run: pip install pandas pyarrow

      - name: Build blueprint data
        if: steps.pick.outputs.leagues != ''
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}        # add in repo Settings → Secrets → Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # enables the beat-reporter reads (optional; falls back to template)
          LEAGUES: ${{ steps.pick.outputs.leagues }}
          TMPDIR: /tmp                                      # the Node engines cache under os.tmpdir() -- pinned so the cache step below finds it
        run: python scripts/build.py

      # 2026-11-22, user: "When running refresh, pasted odds should be removed". A price list pasted from the site (the 📷 box) is used by
      # the build it triggers, then deleted here, so the next refresh shows only the odds feed (or no prices). A board already frozen
      # for the playoffs (window_closed) keeps its file: its EV is against the last pre-playoff screenshot. Only after a good build.
      - name: Drop pasted odds
        if: steps.pick.outputs.leagues != ''
        env:
          LEAGUES: ${{ steps.pick.outputs.leagues }}
        run: |
          python3 - <<'PY'
          import json, os
          PASTED = {"mls": "mls_dk.json", "fcs": "fcs_book.json", "chk": "chk_book.json", "wcbb": "wcbb_fd.json", "cfl": "cfl_book.json",
                    "nwsl": "nwsl_book.json", "afl": "afl_book.json", "nrl": "nrl_book.json", "superleague": "superleague_book.json", "euroleague": "euroleague_book.json", "nbl": "nbl_book.json", "aleague": "aleague_book.json", "liiga": "liiga_book.json", "ligamx": "ligamx_book.json", "superrugby": "superrugby_book.json", "urc": "urc_book.json", "ahl": "ahl_book.json", "swissnl": "swissnl_book.json",
                    "nhl": "nhl_dk.json", "nba": "nba_dk.json", "cbb": "cbb_dk.json"}
          try: builds = json.load(open("data/index.json", encoding="utf-8")).get("builds") or {}
          except Exception: builds = {}
          for lg in [x for x in os.environ.get("LEAGUES", "").split(",") if x in PASTED]:
              f = os.path.join("data", PASTED[lg])
              if not os.path.exists(f): continue
              try: board = json.load(open(f"data/{lg}.json", encoding="utf-8"))
              except Exception: board = {}
              if not (builds.get(lg) or {}).get("ok"): print(f"{lg}: build failed -- keeping {f}"); continue
              if board.get("window_closed"): print(f"{lg}: frozen for the playoffs -- keeping {f}"); continue
              os.remove(f); print(f"{lg}: used and removed {f}")
          PY

      - name: Commit updated data
        if: steps.pick.outputs.leagues != ''
        run: |
          git config user.name  "blueprint-bot"
          git config user.email "blueprint-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # main can move while this run builds (a price saved from the site, another bot run, a code push) --
            # replay this data commit on top and retry, keeping the freshly built files on any conflict
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "push failed after 5 tries"; exit 1
          fi
