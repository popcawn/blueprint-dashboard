name: Refresh blueprint data

on:
  schedule:
    # Daily refresh ~14:00 UTC so the beat-reporter reads (injuries, headlines, form) stay current.
    - cron: "0 14 * * *"
  workflow_dispatch:         # manual trigger + the dashboard "Run" button
    inputs:
      leagues:
        description: "Comma-separated leagues to build (nfl,cfb,nhl,nba,wnba)"
        required: false
        default: "nfl,cfb,nhl,nba,wnba"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blueprint data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}        # add in repo Settings → Secrets → Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # enables the beat-reporter reads (optional; falls back to template)
          LEAGUES: ${{ github.event.inputs.leagues || 'nfl,cfb,nhl,nba,wnba' }}
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name  "blueprint-bot"
          git config user.email "blueprint-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
