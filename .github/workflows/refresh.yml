name: Refresh blueprint data

on:
  schedule:
    # Daily refresh ~14:00 UTC so the beat-reporter reads (injuries, headlines, form) stay current.
    - cron: "0 14 * * *"
  workflow_dispatch:         # manual trigger + the dashboard "Run" button
    inputs:
      leagues:
        description: "Comma-separated leagues to build (nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague)"
        required: false
        default: "nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4     # the MLS, NWSL, FCS, CFL, AFL, NRL and Super League engines are Node (scripts/mls/soccer.mjs, scripts/college/*.mjs, scripts/pro/*.mjs)
        with:
          node-version: "20"

      - uses: actions/cache@v4          # Node engines' data caches (ESPN scoreboards; past seasons never change) -- keeps MLS/FCS builds fast
        with:
          path: |
            /tmp/college_bp_cache
            /tmp/pro_bp_cache
          key: bp-engine-cache-${{ github.run_id }}
          restore-keys: bp-engine-cache-

      - name: Install college-basketball deps (parquet game data)
        run: pip install pandas pyarrow

      - name: Build blueprint data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}        # add in repo Settings → Secrets → Actions
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # enables the beat-reporter reads (optional; falls back to template)
          LEAGUES: ${{ github.event.inputs.leagues || 'nfl,cfb,nhl,nba,wnba,mlb,cbb,wcbb,mls,fcs,cfl,nwsl,afl,nrl,superleague' }}
          TMPDIR: /tmp                                      # the Node engines cache under os.tmpdir() -- pinned so the cache step below finds it
        run: python scripts/build.py

      - name: Commit updated data
        run: |
          git config user.name  "blueprint-bot"
          git config user.email "blueprint-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # main can move while this run builds (a price saved from the site, another bot run, a code push) --
            # replay this data commit on top and retry, keeping the freshly built files on any conflict
            for i in 1 2 3 4 5; do
              if git pull --rebase -X theirs origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            echo "push failed after 5 tries"; exit 1
          fi
