<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championship Blueprint</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#141a23; --panel2:#1a2230; --line:#263040; --ink:#e6edf3; --mut:#8b98a8;
    --grn:#2ea043; --grn-d:#113a1f; --red:#da3633; --red-d:#4a1a1a; --yel:#d29922; --blu:#2f81f7;
    --chip-off:#222c38; --chip-on:#143a22;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#121a28,transparent),var(--bg);color:var(--ink);
    font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  a{color:var(--blu)}
  header{position:sticky;top:0;z-index:8;background:#0b0f16ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:17px;letter-spacing:.3px;font-weight:700}
  h1 span{color:var(--mut);font-weight:400;font-size:13px}
  .tabs{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap}
  .tab{padding:6px 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--mut);cursor:pointer;font-weight:600;font-size:13px}
  .tab.on{background:var(--blu);border-color:var(--blu);color:#fff}
  .runbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1200px;margin:9px auto 0;font-size:12.5px;color:var(--mut)}
  .runbar label{display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
  .runbar input{accent-color:var(--blu);margin:0}
  .btn{background:var(--blu);color:#fff;border:none;border-radius:6px;padding:5px 14px;font-weight:700;cursor:pointer;font-size:12.5px}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--mut)}
  .runmsg{font-size:12px}
  .wrap{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
  /* season header */
  .shdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 4px}
  .shdr .lg{font-size:20px;font-weight:800}
  .shdr .pct{font-size:13px;color:var(--mut)}
  .bar{flex:1 1 140px;max-width:260px;height:6px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blu),#58a6ff)}
  .meta{color:var(--mut);font-size:12px;width:100%}
  .pred{background:linear-gradient(135deg,#15233d,#1d1430);border:1px solid #2f3f66;border-left:4px solid var(--blu);border-radius:10px;padding:11px 14px;margin:10px 0}
  .pred h3{margin:0 0 4px;font-size:11px;color:#7fb0ff;letter-spacing:.5px;text-transform:uppercase}
  .pred p{margin:0;font-size:13px;line-height:1.5}
  .tier{margin:16px 0 2px;font-size:14px;font-weight:700}
  .tier .n{color:var(--mut);font-weight:500;font-size:12px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px}
  .card.t5{border-left-color:var(--grn)} .card.t4{border-left-color:var(--blu)}
  .card.t3{border-left-color:var(--yel)} .card.t2{border-left-color:#5a6675} .card.t1{border-left-color:#2a3340}
  .row1{display:flex;align-items:flex-start;gap:8px}
  .nm{font-weight:700;font-size:15px}
  .conf{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:1px 5px;position:relative;top:1px}
  .rec{color:var(--mut);font-size:12px;position:relative;top:1px}
  .idx{margin-left:auto;text-align:right;font-size:11px;color:var(--mut);flex:0 0 auto}
  .idx b{color:var(--ink);font-size:15px}
  .ev{font-weight:700;padding:2px 8px;border-radius:6px;font-size:12px}
  .ev.pos{background:var(--grn-d);color:#7ee787} .ev.neg{background:var(--red-d);color:#ff9f9b} .ev.zero{background:#2a3340;color:var(--mut)}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}
  .chip{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--chip-off);color:var(--mut);white-space:nowrap}
  .chip.on{background:var(--chip-on);color:#b9f0c4}
  .chip b{font-weight:700;opacity:.65;margin-right:2px;font-size:9.5px}
  .foot{display:flex;align-items:center;gap:12px;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;flex-wrap:wrap}
  .foot .k{color:var(--mut);font-size:10px;display:block}
  .srs{font-size:11.5px;padding:2px 6px;border-radius:5px;font-weight:600}
  .srs.elite{background:var(--grn-d);color:#7ee787} .srs.ok{background:#2a3340;color:#d8dee9} .srs.mirage{background:var(--red-d);color:#ff9f9b}
  .cons{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--mut);font-size:11px}
  .streak{background:#2a3340;border-radius:5px;padding:1px 6px;font-weight:700;color:#e6edf3}
  .streak.star{background:#2d2a14;color:#f2d479}
  .gauntlet{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin:14px 0}
  .gauntlet h3{margin:0 0 5px;font-size:12px}
  .gauntlet .g{display:inline-block;margin:2px 8px 2px 0;font-size:12px} .gauntlet .g b{color:#ff9f9b}
  .note{color:var(--mut);font-size:11.5px;margin-top:16px;padding:11px;background:var(--panel);border-radius:8px;border:1px solid var(--line);line-height:1.55}
  .warn{color:var(--yel)}
  .preseason{text-align:center;color:var(--mut);padding:50px 16px}.preseason .big{font-size:44px;margin-bottom:12px}
  .err{color:#ff9f9b;padding:20px;text-align:center}
  .pop{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
  .pop.on{display:flex} .pop .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:460px;width:100%}
  .pop input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:8px;margin:8px 0;font-size:13px}
  .pop p{font-size:12.5px;color:var(--mut);line-height:1.5}
  @media(max-width:560px){ .tabs{margin-left:0;width:100%} h1 span{display:none} }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Championship Blueprint <span>— live title odds</span></h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="runbar" id="runbar"></div>
</header>
<div class="wrap" id="app"><div class="err">Loading…</div></div>

<div class="pop" id="pop"><div class="box">
  <b>GitHub token</b>
  <p>The Run button triggers the refresh bot via GitHub Actions. Paste a <b>fine-grained token</b> scoped to
  <i>Actions: Read&nbsp;and&nbsp;write</i> on <b>popcawn/blueprint-dashboard</b> only. It's stored in this browser's
  localStorage — never committed.</p>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn ghost" onclick="document.getElementById('pop').classList.remove('on')">Cancel</button>
    <button class="btn" onclick="saveTok()">Save</button>
  </div>
</div></div>

<script>
const REPO = "popcawn/blueprint-dashboard";
const SPORTS = {nfl:"NFL", cfb:"CFB", nhl:"NHL", nba:"NBA"};
const MAXCAT = {nfl:5, cfb:5, nhl:4, nba:4};
const TOTAL  = {nfl:17, cfb:12, nhl:82, nba:82};
const LBL = [["🏆 Best Chance","t5"],["🔵 Great Chance","t4"],["🟢 Good Chance","t3"],["🟡 Outside","t2"],["⚪ Longshot","t1"]];
const tier = (sc,mx)=>LBL[Math.min(Math.max(mx-sc,0),4)];
let DATA={}, HIST={}, cur="nfl";

const evClass = ev => ev==null?"zero":(ev>=15?"pos":(ev<=-10?"neg":"zero"));
const fmtEV = ev => ev==null?"—":(ev>0?"+":"")+ev+"%";
function spark(vals){ if(vals.length<2) return "";
  const w=58,h=16,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-(v-mn)/r*(h-3)-1.5).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${vals[vals.length-1]>=vals[0]?'#3fb950':'#f85149'}" stroke-width="1.4"/></svg>`;
}
function consistency(sport, name){            // index trajectory + top-two-tier streak (not line movement)
  const h = HIST[sport]; if(!h || h.length<1) return {spark:"", streak:0, star:false};
  const present = h.map(s=>s.teams[name]||null);
  const idxs = present.filter(x=>x).map(x=>x.idx);
  const mx = MAXCAT[sport]; let streak=0;
  for(let i=present.length-1;i>=0;i--){ if(present[i]&&present[i].sc>=mx-1) streak++; else break; }
  const star = streak>=2 && streak===present.filter(Boolean).length;
  return {spark:spark(idxs), streak, star};
}

function card(t, sport){
  const cl = tier(t.score, MAXCAT[sport])[1];
  const L = (DATA[sport] && DATA[sport].labels) || [];
  const chips = t.q.map((ok,i)=>`<span class="chip ${ok?'on':''}"><b>${L[i]||''}</b> ${t.vals[i]}</span>`).join("");
  const ev = t.ev!=null ? `<div class="ev ${evClass(t.ev)}" style="margin-top:4px;display:inline-block">${fmtEV(t.ev)} EV</div>` : "";
  let srs="";
  if(sport==="cfb" && t.srsrank!=null){
    const lbl={elite:`SRS #${t.srsrank} ✓`,ok:`SRS #${t.srsrank}`,mirage:`SRS #${t.srsrank} ⚑`}[t.srs_flag];
    srs=`<div><span class="k">schedule-adj</span><span class="srs ${t.srs_flag}">${lbl}</span></div><div><span class="k">SOS</span>#${t.sosrank}</div>`;
  }
  const c = consistency(sport, t.name);
  const cons = c.spark ? `<div class="cons" title="index trajectory + top-tier streak">${c.spark}${c.streak?`<span class="streak ${c.star?'star':''}">${c.star?'⭐':''}${c.streak}w</span>`:''}</div>` : "";
  const conf = t.conf ? `<span class="conf">${t.conf}</span>` : "";
  return `<div class="card ${cl}">
    <div class="row1"><span class="nm">${t.name}</span>${conf}<span class="rec">${t.rec}</span>
      <span class="idx">index <b>${t.index}</b>${ev}</span></div>
    <div class="chips">${chips}</div>
    <div class="foot">
      <div><span class="k">fair</span>${t.fair_odds||"—"}${t.fair_pct?` · ${t.fair_pct}%`:""}</div>
      <div><span class="k">FanDuel</span>${t.market||"—"}</div>${srs}${cons}
    </div></div>`;
}

function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.s===cur));
  const d = DATA[cur], mx=MAXCAT[cur];
  const app = document.getElementById("app");
  if(!d){ app.innerHTML = `<div class="err">No data for ${SPORTS[cur]} yet.</div>`; return; }
  if(d.status==="preseason"){
    app.innerHTML = `<div class="preseason"><div class="big">🏀</div><b>${d.sport} — preseason</b><br><br>${d.note||""}<br><br><span style="font-size:12px">This page fills in on the first real games.</span></div>`;
    return;
  }
  const pct = d.season_pct!=null ? d.season_pct : Math.round((d.gp_max||0)/TOTAL[cur]*100);
  const early = pct < ({nfl:45, cfb:45, nhl:28, nba:28}[cur]);
  let html = `<div class="shdr"><span class="lg">${d.sport}</span>
    <span class="pct">${pct}% of season${early?' <span class="warn">· small sample</span>':''}</span>
    <span class="bar"><i style="width:${pct}%"></i></span>
    <span class="meta">GP ${d.gp_min}–${d.gp_max} · updated ${new Date(d.generated).toLocaleString()}${d.odds_remaining?` · odds credits ${d.odds_remaining}`:""}</span></div>`;
  if(d.prediction && d.prediction.why) html += `<div class="pred"><h3>🎯 Our prediction</h3><p>${d.prediction.why}</p></div>`;
  for(let sc=mx; sc>=0; sc--){
    const g = d.teams.filter(t=>t.score===sc); if(!g.length) continue;
    html += `<div class="tier">${tier(sc,mx)[0]} <span class="n">(${sc}/${mx})</span></div><div class="cards">`;
    g.forEach(t=> html += card(t, cur)); html += `</div>`;
  }
  if(cur==="cfb" && d.gauntlet && d.gauntlet.length){
    html += `<div class="gauntlet"><h3>⚑ Gauntlet watch — elite schedule-adjusted teams the blueprint zeroes</h3>`+
      d.gauntlet.map(g=>`<span class="g">${g.name} <b>SRS #${g.srsrank}</b></span>`).join("")+
      `<div style="font-size:11px;margin-top:5px">Brutal schedules suppress their score — don't treat a 0% as a true longshot.</div></div>`;
  }
  const W={nfl:"Pt Diff 25 · PD/g 20 · Def 20 · Off 20 · Win% 15",cfb:"Margin 30 · Win% 20 · OppPPG 18 · OppYPG 17 · PPG 15 (×SOS³ odds)",
    nhl:"ES Diff 30 · ES Save% 25 · Goals-Against 25 · Corsi 20",nba:"Net/g 30 · Def 22 · Off 20 · Win% 13 · Depth 15"};
  html += `<div class="note"><b>Scoring:</b> the tier (X/${mx}) counts qualifying categories equally; the <b>index</b> is weighted — ${W[cur]} — and sub-ranks teams + drives fair odds. <b>⭐Nw</b> = held a top-two tier N weeks running (consistency), with the index sparkline.
    ${cur==="cfb"?" SRS column is a display-only reality-check (champions were all SRS top-6; ⚑ = schedule mirage).":""}
    ${cur==="nhl"?" Depth note: NHL depth is already baked into the team-level ES goal diff / Corsi / GA — four lines rolling shows up as those numbers, so no separate depth metric is needed.":""}
    ${cur==="nba"?" <b>Depth</b> (count of 10+ PPG players — balanced rosters win titles) is rewarded directly in the index.":""}
    ${early?'<br><span class="warn">⚠ Small sample this early — the market is sharper than the model; big EVs are usually model-lag, not value.</span>':''}</div>`;
  app.innerHTML = html;
}

/* ---- Run button: trigger the Actions bot via workflow_dispatch ---- */
function tok(){ try{return localStorage.getItem("gh_token")||""}catch(e){return ""} }
function saveTok(){ try{localStorage.setItem("gh_token",document.getElementById("tok").value.trim())}catch(e){} document.getElementById("pop").classList.remove("on"); }
function selectedLeagues(){ return [...document.querySelectorAll(".lgchk:checked")].map(c=>c.value); }
async function runBlueprint(){
  const leagues = selectedLeagues();
  const msg = document.getElementById("runmsg");
  if(!leagues.length){ msg.textContent="select a league"; return; }
  if(!tok()){ document.getElementById("pop").classList.add("on"); document.getElementById("tok").value=tok(); return; }
  const btn=document.getElementById("runbtn"); btn.disabled=true; msg.innerHTML="⏳ triggering bot…";
  try{
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/refresh.yml/dispatches`,{
      method:"POST", headers:{Authorization:`Bearer ${tok()}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},
      body: JSON.stringify({ref:"main", inputs:{leagues: leagues.join(",")}})});
    if(r.status===204){ msg.innerHTML="✅ running — auto-refreshes when done"; pollFresh(); }
    else if(r.status===401||r.status===403){ msg.innerHTML='<span style="color:#ff9f9b">token invalid/expired</span>'; document.getElementById("pop").classList.add("on"); }
    else { msg.innerHTML=`<span style="color:#ff9f9b">dispatch failed (${r.status})</span>`; }
  }catch(e){ msg.innerHTML='<span style="color:#ff9f9b">network error</span>'; }
  btn.disabled=false;
}
async function pollFresh(){
  let before=null; try{before=(await (await fetch("data/index.json?t="+Date.now())).json()).generated}catch(e){}
  let n=0; const iv=setInterval(async()=>{
    n++; if(n>24){ clearInterval(iv); document.getElementById("runmsg").textContent="still building… refresh later"; return; }
    try{ const g=(await (await fetch("data/index.json?t="+Date.now())).json()).generated;
      if(g && g!==before){ clearInterval(iv); document.getElementById("runmsg").innerHTML="✅ updated"; await loadData(); render(); }
    }catch(e){}
  }, 8000);
}

async function loadData(){
  for(const k of Object.keys(SPORTS)){
    try{ const r=await fetch(`data/${k}.json?t=`+Date.now()); if(r.ok) DATA[k]=await r.json(); }catch(e){}
    try{ const r=await fetch(`data/history/${k}.json?t=`+Date.now()); if(r.ok) HIST[k]=await r.json(); }catch(e){}
  }
}
async function load(){
  document.getElementById("tabs").innerHTML = Object.entries(SPORTS).map(([k,v])=>`<button class="tab" data-s="${k}">${v}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=> b.onclick=()=>{cur=b.dataset.s; render();});
  document.getElementById("runbar").innerHTML =
    `<span>Run blueprint:</span>`+Object.entries(SPORTS).map(([k,v])=>`<label><input type="checkbox" class="lgchk" value="${k}" checked>${v}</label>`).join("")+
    `<button class="btn" id="runbtn" onclick="runBlueprint()">▶ Run</button>
     <button class="btn ghost" title="GitHub token" onclick="document.getElementById('pop').classList.add('on');document.getElementById('tok').value=tok()">⚙</button>
     <span class="runmsg" id="runmsg"></span>`;
  await loadData();
  render();
}
load();
</script>
</body>
</html>
