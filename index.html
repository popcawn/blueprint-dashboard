<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Champions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏆%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --panel2:#f4f7fb; --line:#e4e9f1; --line2:#d6deea;
    --ink:#0f1726; --ink2:#44536a; --ink3:#73819a;
    --good:#0b9a5e; --goodbg:#e4f6ec; --bad:#d93a48; --badbg:#fdeaec; --warn:#a86f00; --warnbg:#fbf1dc; --star:#c98a00;
    --accent:#2f6fe4; --accent2:#6a55f0; --onacc:#fff;
    --shadow:0 1px 2px rgba(15,23,38,.05),0 10px 28px -16px rgba(15,23,38,.22);
    --head:"Space Grotesk",Inter,system-ui,sans-serif; --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(1200px 560px at 50% -220px,#dfe8fb,transparent 70%),var(--bg)}
  a{color:var(--accent);text-decoration:none}
  /* topbar */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
  .tb{max-width:1500px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:11px clamp(14px,3vw,30px)}
  .brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:20px;letter-spacing:-.3px;color:var(--ink)}
  .brand .trophy{font-size:22px;line-height:1;filter:drop-shadow(0 4px 10px rgba(201,138,0,.4))}
  .brand span{color:var(--ink3);font-weight:500;font-size:13px;font-family:var(--sans)}
  .sportbar{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px}
  .sportbar button{padding:6px 15px;border:0;border-radius:999px;background:none;color:var(--ink2);font-weight:700;font-size:13.5px;cursor:pointer;font-family:var(--sans)}
  .sportbar button.on{background:var(--ink);color:#fff}
  .strip{display:flex;gap:9px;margin-left:auto;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 13px;line-height:1.25;min-width:66px}
  .stat small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
  .stat b{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap}
  .stat .g{color:var(--good)} .stat .r{color:var(--bad)}
  /* layout */
  .wrap{max-width:1500px;margin:0 auto;padding:18px clamp(14px,3vw,30px) 70px}
  .hero{background:linear-gradient(135deg,rgba(47,111,228,.10),rgba(106,85,240,.07)),var(--panel);border:1px solid rgba(47,111,228,.28);border-radius:20px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:6px}
  .heror{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .heror>div:first-child{flex:1 1 420px;min-width:0}
  .herot{font-family:var(--head);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
  .heror p{margin:0;font-size:14.5px;line-height:1.5}
  .runbox{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  .lgs{display:flex;gap:6px;flex-wrap:wrap}
  .lgs label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer}
  .lgs input{accent-color:var(--accent);margin:0}
  .btn{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border:none;border-radius:11px;padding:9px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:var(--sans);box-shadow:0 6px 16px -8px var(--accent)}
  .btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink2);box-shadow:none;padding:9px 12px}
  .runmsg{font-size:12px;color:var(--ink3)}
  .sbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 4px}
  .sbar .bar{flex:1 1 180px;max-width:340px;height:7px;background:var(--line);border-radius:5px;overflow:hidden}
  .sbar .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .sbar .m{color:var(--ink3);font-size:12px}
  .sig{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;cursor:help}
  .sig.trust{background:rgba(11,154,94,.12);color:var(--good);border-color:rgba(11,154,94,.35)}
  .sig.firming{background:rgba(214,160,20,.14);color:#b98700;border-color:rgba(214,160,20,.4)}
  .sig.early{background:rgba(217,58,72,.12);color:var(--bad);border-color:rgba(217,58,72,.35)}
  .vbadge{font-size:10px;font-weight:800;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--good);color:#fff;margin-left:2px;white-space:nowrap}
  .ftt{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:2px;white-space:nowrap;border:1px solid var(--line)}
  .ftt.pass{background:var(--goodbg);color:var(--good);border-color:rgba(11,154,94,.35)}
  .ftt.fail{background:var(--panel2);color:var(--ink3)}
  .ftt.pending{background:var(--panel2);color:var(--ink3)}
  .signote{font-size:11.5px;color:var(--ink3);margin:2px 0 8px}
  .signote.early{color:var(--bad)} .signote.firming{color:#b98700}
  .tier{margin:18px 0 9px;font-family:var(--head);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink2)}
  .tier .n{color:var(--ink3);font-weight:500;font-size:11px;letter-spacing:.04em}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(365px,1fr));gap:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc,var(--line2));border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .card.t5{--tc:var(--good)} .card.t4{--tc:var(--accent)} .card.t3{--tc:var(--star)} .card.t2{--tc:#9aa7bb} .card.t1{--tc:#c7d0dd}
  .row1{display:flex;align-items:baseline;gap:8px}
  .nm{font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:-.2px}
  .conf{font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .rec{color:var(--ink3);font-size:13px}
  .idx{margin-left:auto;text-align:right;font-size:11px;color:var(--ink3)}
  .idx b{color:var(--ink);font-size:16px;font-family:var(--mono)}
  .ev{font-weight:800;padding:2px 9px;border-radius:7px;font-size:12.5px;font-family:var(--mono)}
  .ev.pos{background:var(--goodbg);color:var(--good)} .ev.neg{background:var(--badbg);color:var(--bad)} .ev.zero{background:var(--panel2);color:var(--ink3)}
  .read{display:flex;gap:9px;align-items:flex-start;margin:11px 0 3px;padding:10px 12px;border-radius:12px}
  .read.trust{background:var(--goodbg);border:1px solid #bfe6d0} .read.caution{background:var(--warnbg);border:1px solid #ecd9a6} .read.fools_gold{background:var(--badbg);border:1px solid #f3c2c7}
  .rv{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 8px;border-radius:7px;white-space:nowrap;margin-top:1px;color:#fff}
  .rv.trust{background:var(--good)} .rv.caution{background:var(--warn)} .rv.fools_gold{background:var(--bad)}
  .rwhy{font-size:13px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
  .chip.on{background:var(--goodbg);border-color:#bfe6d0;color:var(--good)}
  .chip b{font-weight:700;opacity:.7;margin-right:3px;font-size:9.5px}
  .foot{display:flex;align-items:center;gap:14px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;flex-wrap:wrap}
  .foot .k{color:var(--ink3);font-size:10px;display:block}
  .foot b{font-family:var(--mono)}
  .srs{font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:600}
  .srs.elite{background:var(--goodbg);color:var(--good)} .srs.ok{background:var(--panel2);color:var(--ink2)} .srs.mirage{background:var(--badbg);color:var(--bad)}
  .cons{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:11px}
  .streak{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:700;color:var(--ink)}
  .streak.star{background:#fbf1dc;border-color:#ecd9a6;color:var(--star)}
  .gauntlet{background:var(--panel2);border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;margin:16px 0}
  .gauntlet h3{margin:0 0 6px;font-size:12px;font-family:var(--head);text-transform:uppercase;letter-spacing:.06em}
  .gauntlet .g{display:inline-block;margin:2px 9px 2px 0;font-size:12.5px} .gauntlet .g b{color:var(--bad)}
  .note{color:var(--ink3);font-size:11.5px;margin-top:18px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;line-height:1.55}
  .warn{color:var(--warn)}
  .preseason{text-align:center;color:var(--ink3);padding:56px 16px}.preseason .big{font-size:46px;margin-bottom:12px}
  .pop{position:fixed;inset:0;background:#0f172699;display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
  .pop.on{display:flex} .pop .box{background:var(--panel);border-radius:16px;padding:20px;max-width:470px;width:100%;box-shadow:var(--shadow)}
  .pop input{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:9px;color:var(--ink);padding:9px;margin:9px 0;font-size:13px}
  .pop p{font-size:12.5px;color:var(--ink2);line-height:1.5}
  @media(max-width:620px){ .brand span{display:none} .strip{width:100%;margin-left:0} .sportbar{order:3} }
</style>
</head>
<body>
<header class="topbar"><div class="tb">
  <a class="brand"><span class="trophy">🏆</span>Champions <span>title odds</span></a>
  <nav class="sportbar" id="tabs"></nav>
  <div class="strip" id="strip"></div>
</div></header>
<div class="wrap" id="app"></div>

<div class="pop" id="pop"><div class="box">
  <b>GitHub token</b>
  <p>The Run button triggers the refresh bot via GitHub Actions. Paste a <b>fine-grained token</b> with <i>Actions: Read&nbsp;and&nbsp;write</i> on <b>popcawn/blueprint-dashboard</b>. Stored in this browser only — never committed.</p>
  <input id="tok" type="password" placeholder="github_pat_…" autocomplete="off">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn ghost" onclick="document.getElementById('pop').classList.remove('on')">Cancel</button>
    <button class="btn" onclick="saveTok()">Save</button>
  </div>
</div></div>

<script>
const REPO="popcawn/blueprint-dashboard";
const SPORTS={nfl:"NFL",cfb:"CFB",nhl:"NHL",nba:"NBA"};
const MAXCAT={nfl:5,cfb:5,nhl:4,nba:4}, TOTAL={nfl:17,cfb:12,nhl:82,nba:82};
const LBL=[["🏆 Best Chance","t5"],["🔵 Great Chance","t4"],["🟢 Good Chance","t3"],["🟡 Outside","t2"],["⚪ Longshot","t1"]];
const tier=(sc,mx)=>LBL[Math.min(Math.max(mx-sc,0),4)];
let DATA={},HIST={},cur="nfl",VPSET=new Set();
const evClass=ev=>ev==null?"zero":(ev>=15?"pos":(ev<=-10?"neg":"zero"));
const fmtEV=ev=>ev==null?"—":(ev>0?"+":"")+ev+"%";
const shortNm=n=>n? n.split(" ").slice(-1)[0] : "—";
function spark(v){ if(v.length<2)return""; const w=56,h=15,mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1;
  const p=v.map((x,i)=>`${(i/(v.length-1)*w).toFixed(1)},${(h-(x-mn)/r*(h-3)-1.5).toFixed(1)}`).join(" ");
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline points="${p}" fill="none" stroke="${v[v.length-1]>=v[0]?'#0b9a5e':'#d93a48'}" stroke-width="1.5"/></svg>`;}
function consistency(sp,nm){ const h=HIST[sp]; if(!h||!h.length)return{spark:"",streak:0,star:false};
  const pr=h.map(s=>s.teams[nm]||null), idx=pr.filter(x=>x).map(x=>x.idx), mx=MAXCAT[sp]; let st=0;
  for(let i=pr.length-1;i>=0;i--){ if(pr[i]&&pr[i].sc>=mx-1)st++; else break; }
  return{spark:spark(idx),streak:st,star:st>=2&&st===pr.filter(Boolean).length};}

function card(t,sp){
  const cl=tier(t.score,MAXCAT[sp])[1], L=(DATA[sp]&&DATA[sp].labels)||[];
  const chips=t.q.map((ok,i)=>`<span class="chip ${ok?'on':''}"><b>${L[i]||''}</b> ${t.vals[i]}</span>`).join("");
  const ev=t.ev!=null?`<div class="ev ${evClass(t.ev)}" style="margin-top:4px;display:inline-block">${fmtEV(t.ev)} EV</div>`:"";
  let srs=""; if(sp==="cfb"&&t.srsrank!=null){ const l={elite:`SRS #${t.srsrank} ✓`,ok:`SRS #${t.srsrank}`,mirage:`SRS #${t.srsrank} ⚑`}[t.srs_flag];
    srs=`<div><span class="k">schedule-adj</span><span class="srs ${t.srs_flag}">${l}</span></div><div><span class="k">SOS</span>#${t.sosrank}</div>`;}
  const c=consistency(sp,t.name);
  const cons=c.spark?`<div class="cons" title="index trajectory + top-tier streak">${c.spark}${c.streak?`<span class="streak ${c.star?'star':''}">${c.star?'⭐':''}${c.streak}w</span>`:''}</div>`:"";
  const RV={trust:"TRUST",caution:"CAUTION",fools_gold:"FOOL'S GOLD"};
  const TIER={pretender:"PRETENDER",contender:"CONTENDER",champion:"CHAMPION"};
  const rlabel=t.read&&t.read.tier?(TIER[t.read.tier]||RV[t.read.v]):(t.read?RV[t.read.v]:"");
  const rtxt=t.read?(t.read.beat||t.read.why):"";
  const read=t.read?`<div class="read ${t.read.v}"><span class="rv ${t.read.v}">${rlabel||''}</span><span class="rwhy">${rtxt}</span></div>`:"";
  return `<div class="card ${cl}">
    <div class="row1"><span class="nm">${t.name}</span>${t.conf?`<span class="conf">${t.conf}</span>`:""}<span class="rec">${t.rec}</span>${sp==="nba"&&t.ftt?`<span class="ftt ${t.ftt}" title="40 wins before 20 losses — 8/10 recent champs cleared it (a positive pedigree signal, not a requirement). Resolves ~game 50+.">${{pass:"✓ 40-20",fail:"✗ 40-20",pending:"40-20 ○"}[t.ftt]||""}</span>`:""}${VPSET.has(t.name)?'<span class="vbadge" title="Qualified value: complete profile + trust read + positive EV at a believable price">✓ VALUE</span>':''}
      <span class="idx">index <b>${t.index}</b>${ev}</span></div>
    ${read}<div class="chips">${chips}</div>
    <div class="foot"><div><span class="k">fair</span><b>${t.fair_odds||"—"}</b>${t.fair_pct?` · ${t.fair_pct}%`:""}</div>
      <div><span class="k">FanDuel</span><b>${t.market||"—"}</b></div>${srs}${cons}</div></div>`;
}

function render(){
  document.querySelectorAll(".sportbar button").forEach(b=>b.classList.toggle("on",b.dataset.s===cur));
  const d=DATA[cur], mx=MAXCAT[cur], app=document.getElementById("app"), strip=document.getElementById("strip");
  if(!d){ app.innerHTML=`<div class="preseason">No data.</div>`; strip.innerHTML=""; return; }
  if(d.status==="preseason"){
    strip.innerHTML=`<div class="stat"><small>${d.sport}</small><b>preseason</b></div>`;
    app.innerHTML=`<div class="preseason"><div class="big">🏀</div><b>${d.sport} — preseason</b><br><br>${d.note||""}<br><br><span style="font-size:12px">Fills in on the first real games.</span></div>`; return;
  }
  const pct=d.season_pct!=null?d.season_pct:Math.round((d.gp_max||0)/TOTAL[cur]*100);
  const early=pct<({nfl:45,cfb:45,nhl:28,nba:28}[cur]);
  const teams=d.teams, contenders=teams.filter(t=>t.score>=2).length;
  const vp=(d.value_plays||[]); VPSET=new Set(vp.map(x=>x.name));
  const bv=vp[0], traps=teams.filter(t=>t.read&&t.read.v==="fools_gold").length;
  strip.innerHTML=[
    `<div class="stat"><small>Season</small><b>${pct}%</b></div>`,
    `<div class="stat"><small>Contenders</small><b>${contenders}</b></div>`,
    `<div class="stat"><small>Top pick</small><b>${shortNm(d.prediction&&d.prediction.pick)}</b></div>`,
    `<div class="stat" title="Complete profile + trust read + positive EV at a believable (<=+2500) price. Backtested to isolate value-dog champions; empty in chalk years."><small>Value play</small><b class="${bv?'g':''}">${bv?shortNm(bv.name)+" "+fmtEV(bv.ev):"none"}</b></div>`,
    `<div class="stat"><small>Traps</small><b class="${traps?'r':''}">${traps}</b></div>`].join("");
  const checks=Object.entries(SPORTS).map(([k,v])=>`<label><input type="checkbox" class="lgchk" value="${k}" ${k===cur?'checked':''}>${v}</label>`).join("");
  let html=`<div class="hero"><div class="heror">
    <div><div class="herot">🎯 Our prediction</div><p>${d.prediction?d.prediction.why:"—"}</p></div>
    <div class="runbox"><div class="lgs">${checks}</div>
      <div style="display:flex;gap:7px;align-items:center"><button class="btn" id="runbtn" onclick="runBlueprint()">▶ Run</button>
      <button class="btn ghost" title="GitHub token" onclick="document.getElementById('pop').classList.add('on');document.getElementById('tok').value=tok()">⚙</button></div>
      <span class="runmsg" id="runmsg"></span></div></div></div>
    <div class="sbar">${d.signal?`<span class="sig ${d.signal.status}" title="${d.signal.note}">${d.signal.emoji} ${d.signal.label}</span>`:""}<span class="bar"><i style="width:${pct}%"></i></span>
      <span class="m">${d.sport} · ${pct}% of season · GP ${d.gp_min}–${d.gp_max} · updated ${new Date(d.generated).toLocaleDateString()}${d.odds_remaining?` · ${d.odds_remaining} credits`:""}</span></div>
    ${d.signal?`<div class="signote ${d.signal.status}">${d.signal.note}</div>`:""}`;
  for(let sc=mx;sc>=0;sc--){ const g=teams.filter(t=>t.score===sc); if(!g.length)continue;
    html+=`<div class="tier">${tier(sc,mx)[0]} <span class="n">(${sc}/${mx})</span></div><div class="cards">${g.map(t=>card(t,cur)).join("")}</div>`; }
  if(cur==="cfb"&&d.gauntlet&&d.gauntlet.length){
    html+=`<div class="gauntlet"><h3>⚑ Gauntlet watch</h3>`+d.gauntlet.map(g=>`<span class="g">${g.name} <b>SRS #${g.srsrank}</b></span>`).join("")+`<div style="font-size:11px;margin-top:5px">Brutal schedules suppress their score — a 0% here isn't a true longshot.</div></div>`; }
  const W={nfl:"Pt Diff 25 · PD/g 20 · Def 20 · Off 20 · Win% 15",cfb:"Margin 30 · Win% 20 · OppPPG 18 · OppYPG 17 · PPG 15 (×SOS³)",nhl:"ES Diff 30 · Save% 25 · Goals-Against 25 · Corsi 20",nba:"Net/g 30 · Def 22 · Off 20 · Win% 13 · Depth 15"};
  html+=`<div class="note"><b>The Read</b> is the automated trust call — it reads the component ranks, not the composite, and flags a top team hiding a playoff-fatal hole (🔴) vs a complete one (🟢). <b>Index weights:</b> ${W[cur]} (the tier counts categories equally). <b>⭐Nw</b> = top-two tier N weeks running.${cur==="nhl"?" NHL depth is already in the team-level numbers.":cur==="nba"?" Depth (10+ PPG scorers) is rewarded in the index.":""}${early?' <span class="warn">⚠ Early sample — market sharper than model; big EVs are usually model-lag.</span>':''}</div>`;
  app.innerHTML=html;
}

/* run button */
function tok(){try{return localStorage.getItem("gh_token")||""}catch(e){return""}}
function saveTok(){try{localStorage.setItem("gh_token",document.getElementById("tok").value.trim())}catch(e){}document.getElementById("pop").classList.remove("on");}
async function runBlueprint(){
  const lg=[...document.querySelectorAll(".lgchk:checked")].map(c=>c.value), msg=document.getElementById("runmsg");
  if(!lg.length){msg.textContent="select a league";return;}
  if(!tok()){document.getElementById("pop").classList.add("on");document.getElementById("tok").value=tok();return;}
  const btn=document.getElementById("runbtn");btn.disabled=true;msg.innerHTML="⏳ triggering…";
  try{ const r=await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/refresh.yml/dispatches`,{method:"POST",
      headers:{Authorization:`Bearer ${tok()}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},
      body:JSON.stringify({ref:"main",inputs:{leagues:lg.join(",")}})});
    if(r.status===204){msg.innerHTML="✅ running — auto-refreshes";pollFresh();}
    else if(r.status===401||r.status===403){msg.innerHTML='<span style="color:var(--bad)">token invalid</span>';document.getElementById("pop").classList.add("on");}
    else msg.innerHTML=`<span style="color:var(--bad)">failed (${r.status})</span>`;
  }catch(e){msg.innerHTML='<span style="color:var(--bad)">network error</span>';}
  btn.disabled=false;
}
async function pollFresh(){ let before=null; try{before=(await(await fetch("data/index.json?t="+Date.now())).json()).generated}catch(e){}
  let n=0; const iv=setInterval(async()=>{ n++; if(n>24){clearInterval(iv);document.getElementById("runmsg").textContent="still building…";return;}
    try{const g=(await(await fetch("data/index.json?t="+Date.now())).json()).generated;
      if(g&&g!==before){clearInterval(iv);document.getElementById("runmsg").innerHTML="✅ updated";await loadData();render();}}catch(e){} },8000);
}
async function loadData(){ for(const k of Object.keys(SPORTS)){
  try{const r=await fetch(`data/${k}.json?t=`+Date.now());if(r.ok)DATA[k]=await r.json();}catch(e){}
  try{const r=await fetch(`data/history/${k}.json?t=`+Date.now());if(r.ok)HIST[k]=await r.json();}catch(e){} } }
async function load(){
  document.getElementById("tabs").innerHTML=Object.entries(SPORTS).map(([k,v])=>`<button data-s="${k}">${v}</button>`).join("");
  document.querySelectorAll(".sportbar button").forEach(b=>b.onclick=()=>{cur=b.dataset.s;render();});
  await loadData(); render();
}
load();
</script>
